[package]
name = "inkcore"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
flate2 = "1"
# no "simd": on x86 it rounds where the scalar path (ARM, wasm) truncates and sums coverage in another order,
# so frames would differ between platforms
fontdue = { version = "0.9", default-features = false, features = ["hashbrown"] }
getrandom = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
mlua = { version = "0.12.2", features = ["lua55", "vendored"] }
qrcode = { version = "0.15", default-features = false }
rand_chacha = "0.9"
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
unicode-bidi = "0.3.18"

[[example]]
name = "hello_hash"
test = true
