[project]
name = "inkemu"
version = "0.1.0"
description = "Desktop emulator of the Xteink X4 Pro InkApp (XTOS Licorice) Lua host"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "lupa>=2.8",
    "mcp>=2.3.0",
    "pillow>=13.0",
    "segno>=1.6.6",
]

[project.scripts]
inkemu = "inkemu.cli:main"
inkemu-mcp = "inkemu.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=9.2.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
