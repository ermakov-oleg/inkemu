[package]
name = "inkemu-py"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
inkcore = { path = "../inkcore" }
inkemu = { path = "../inkemu" }
pyo3 = { version = "0.27", features = ["abi3-py311"] }

[features]
extension-module = ["pyo3/extension-module"]
