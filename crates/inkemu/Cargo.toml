[package]
name = "inkemu"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
clap = { version = "4", features = ["string"] }
inkcore = { path = "../inkcore" }
serde = { version = "1", features = ["derive"] }
png = "0.18"
# raw_value: a big integer secret keeps its digits (only this crate; arbitrary_precision would change ctx.json)
serde_json = { version = "1", features = ["raw_value"] }
# no gzip: urllib in 0.1 neither asked for nor decoded compressed bodies
ureq = { version = "2.12", default-features = false, features = ["tls"] }
tiny_http = "0.12"
rmcp = { version = "3.11", default-features = false, features = ["server", "macros", "transport-io"] }
schemars = "1"
tokio = { version = "1", features = ["rt"] }
base64 = "0.22"
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

