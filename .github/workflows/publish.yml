name: Publish

# Tag push `vX.Y.Z` -> PyPI. Manual run -> TestPyPI (a version can be uploaded there only once).
# A pull request into main builds and checks the same files without uploading them.
on:
  push:
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sdist:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: scripts/vendor-lua.sh
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: "3.11"
          # on a pull request nothing here runs uv, and the post step fails on a cache dir that was never made
          enable-cache: false
      - name: tag matches project version
        if: github.ref_type == 'tag'
        run: |
          version="$(uv version --short)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match pyproject version $version"
            exit 1
          fi
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: dist-sdist
          path: dist/
          if-no-files-found: error

  wheels:
    name: wheel (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: macos-arm64, os: macos-latest, target: aarch64-apple-darwin}
          - {name: macos-x86_64, os: macos-latest, target: x86_64-apple-darwin}
          - {name: manylinux-x86_64, os: ubuntu-latest, target: x86_64-unknown-linux-gnu}
          # native: ring's assembly does not build with the manylinux2014 cross gcc (no __ARM_ARCH)
          - {name: manylinux-aarch64, os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu}
    steps:
      - uses: actions/checkout@v7
      - run: scripts/vendor-lua.sh
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: auto
          args: --release --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: dist-wheel-${{ matrix.name }}
          path: dist/
          if-no-files-found: error

  check:
    needs: [sdist, wheels]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist/
      - uses: astral-sh/setup-uv@v10.4.0
      - run: uvx twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  pypi:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/inkemu/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/inkemu/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
