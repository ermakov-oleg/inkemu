[project]
name = "inkemu"
version = "0.1.1"
description = "Desktop emulator of the Xteink X4 Pro InkApp (XTOS Licorice) Lua host"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["xteink", "e-ink", "emulator", "lua", "inkapp", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Lua",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Embedded Systems",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Emulators",
]
dependencies = [
    "mcp>=2.3.0",
    "pillow>=13.0",
]

[project.urls]
Homepage = "https://github.com/ermakov-oleg/inkemu"
Repository = "https://github.com/ermakov-oleg/inkemu"
Issues = "https://github.com/ermakov-oleg/inkemu/issues"

[project.scripts]
inkemu = "inkemu.cli:main"
inkemu-mcp = "inkemu.mcp_server:main"

[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[tool.maturin]
python-source = "src"
module-name = "inkemu._core"
manifest-path = "crates/inkemu-py/Cargo.toml"
features = ["extension-module"]
include = [
    { path = "vendor/**/*", format = "sdist" },
    { path = "patches/**/*", format = "sdist" },
    { path = "scripts/**/*", format = "sdist" },
    { path = "assets/**/*", format = "sdist" },
    { path = "rust-toolchain.toml", format = "sdist" },
    { path = "tests/**/*", format = "sdist" },
    { path = "examples/**/*", format = "sdist" },
    { path = "uv.lock", format = "sdist" },
]

[tool.uv]
# rebuild the _core extension on `uv run`/`uv sync` when the Rust side changes
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "crates/**/*.rs" },
    { file = "crates/**/*.lua" },
    { file = "assets/fonts/*" },
    { file = "crates/**/Cargo.toml" },
    { file = "patches/**/*" },
    { file = "vendor/**/*" },
    { file = "rust-toolchain.toml" },
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# tests embed Lua sources: one-line Lua chunks run past the limit and %-templating avoids escaping Lua's braces
"tests/**" = ["E501", "UP031"]
